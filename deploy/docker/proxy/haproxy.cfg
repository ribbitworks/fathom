# Fathom's proxy: the only container users reach. It passes each encrypted connection through to the
# server unchanged, without the certificate or any way to read the traffic, and starts it with a
# PROXY protocol header naming the client, so the server can log the client's address.

global
  log stdout format raw local0 info
  maxconn 2000

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 60s
  timeout server 60s

# Docker's built-in name server, so the proxy finds the server again if it restarts.
resolvers docker
  nameserver docker 127.0.0.11:53
  hold valid 10s

frontend https
  bind :8443
  default_backend app

backend app
  server app app:8443 send-proxy-v2 resolvers docker init-addr last,libc,none
