# SPDX-License-Identifier: Apache-2.0

# Builds, scans and publishes a release's container images to the GitHub Container Registry, when
# its release is published or, for a tag already released, by hand from the Actions tab.

name: Publish release images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.1.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}

jobs:
  publish:
    # The default branch's scripts and security exceptions judge the release, never another branch's
    # or the tag's: a published release runs from its tag, so it checks out the default branch.
    if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out with every tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Sign in to the GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build, scan and publish the images
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
        # The registry needs the owner's name in lowercase.
        run: FATHOM_REGISTRY="ghcr.io/${OWNER,,}" pnpm publish:images "$TAG"

      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

      - name: Keep the scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-scan
          path: output/security/
          if-no-files-found: ignore
