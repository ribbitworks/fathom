# SPDX-License-Identifier: Apache-2.0

# Runs the full check, 'pnpm check', on every pull request and every push to the default branch,
# leaving out the package tests, the server's coverage and the container tests on a pull request of
# documentation alone.

name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  # Every push to the default branch is checked; only a pull request's older runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Decide what the change needs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      documentation-only: ${{ steps.decide.outputs.documentation-only }}
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The decision needs Node.js alone, not the dependencies, so it delays the other jobs little.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Decide whether the change is documentation alone
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # Every push to the default branch runs everything, and so does a pull request whose changes
        # can't be told.
        run: |
          only=false
          if [ -n "$BASE" ]; then
            only="$(node scripts/documentation-only.mjs "$BASE")" || only=false
          fi
          echo "documentation-only=$only" >>"$GITHUB_OUTPUT"

  check:
    name: Check without package tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # With full history, so the secrets scan sees every commit and the image scans can compare
      # with the default branch.
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and the dependencies
        uses: ./.github/actions/setup

      - name: Run the full check but the package tests
        run: pnpm check --skip "Package tests"

  # On one runner beside the linters and scans, the package tests ran up to thirty times slower than
  # on a developer's computer, until tests timed out, so they have runners of their own.
  packages:
    # A skipped job's name is shown unexpanded, so it names no matrix value; GitHub adds each part's
    # name after it when the job runs, such as Package tests (web).
    name: Package tests
    needs: changes
    if: needs.changes.outputs.documentation-only != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    # The web app's and the server's tests take longest, so each has a runner's four cores, and the
    # server's, the longest, are split across three runners, their coverage checked once merged; the
    # rest share one runner, a worker each. A package added later runs with the rest. Each part's
    # settings are looked up by its name, so the matrix holds only the name, which GitHub adds to the
    # job's.
    env:
      PARTS: >-
        {"web": {"packages": "@fathom/web", "workers": 4},
        "server 1 of 3": {"packages": "@fathom/server", "workers": 4, "shard": "1/3"},
        "server 2 of 3": {"packages": "@fathom/server", "workers": 4, "shard": "2/3"},
        "server 3 of 3": {"packages": "@fathom/server", "workers": 4, "shard": "3/3"},
        "the rest": {"packages": "!@fathom/web !@fathom/server", "workers": 1}}
    strategy:
      fail-fast: false
      matrix:
        part: [web, server 1 of 3, server 2 of 3, server 3 of 3, the rest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and the dependencies
        uses: ./.github/actions/setup

      # A selector matching no package fails, so a renamed package is never left untested. A shard
      # covers part of the code, so it keeps its coverage in a report for the merge, which checks the
      # coverage, rather than checking its own.
      - name: Run the package tests
        env:
          PACKAGES: ${{ fromJSON(env.PARTS)[matrix.part].packages }}
          VITEST_MAX_WORKERS: ${{ fromJSON(env.PARTS)[matrix.part].workers }}
          SHARD: ${{ fromJSON(env.PARTS)[matrix.part].shard }}
          PART: ${{ matrix.part }}
        run: |
          if [ -z "$PACKAGES" ]; then
            echo "error: PARTS has no packages for the part '$PART'" >&2
            exit 1
          fi
          read -r -a selectors <<<"$PACKAGES"
          filters=()
          for selector in "${selectors[@]}"; do filters+=(--filter "$selector"); done
          sharding=()
          if [ -n "$SHARD" ]; then
            sharding=(--shard="$SHARD" --reporter=default --reporter=blob --coverage.thresholds=false)
          fi
          pnpm test:packages "${filters[@]}" --fail-if-no-match ${sharding[@]+"${sharding[@]}"}

      - name: Keep the shard's report for the merge
        if: fromJSON(env.PARTS)[matrix.part].shard != null
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-tests-${{ matrix.part }}
          path: apps/server/.vitest/blob/
          # Vitest keeps its reports in a hidden folder, which uploads leave out by default.
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # The server's shards' reports merged, which checks its coverage as a whole run would.
  server-coverage:
    name: Server coverage
    needs: [changes, packages]
    if: needs.changes.outputs.documentation-only != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and the dependencies
        uses: ./.github/actions/setup

      - name: Gather the shards' reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-tests-*
          path: apps/server/.vitest/blob/
          merge-multiple: true

      # Each report is named for its shard and the shards' count, such as blob-1-3.json, so a report
      # missing names its cause rather than failing on the coverage alone.
      - name: Merge the reports and check the coverage
        run: |
          reports=(apps/server/.vitest/blob/blob-*-*.json)
          if [ ! -e "${reports[0]}" ]; then
            echo "error: found none of the server's shard reports" >&2
            exit 1
          fi
          name="${reports[0]##*/}"
          expected="${name##*-}"
          expected="${expected%.json}"
          if [ "${#reports[@]}" -ne "$expected" ]; then
            echo "error: found ${#reports[@]} of the server's $expected shard reports" >&2
            exit 1
          fi
          pnpm --filter @fathom/server test:merge

  containers:
    name: Container tests
    needs: changes
    if: needs.changes.outputs.documentation-only != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and the dependencies
        uses: ./.github/actions/setup

      - name: Run the container tests
        run: pnpm test:containers

  full:
    name: Full check
    needs: [changes, check, packages, server-coverage, containers]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # The package tests, the server's coverage and the container tests may be left out only for
      # documentation alone; everything else must pass.
      # It runs even in a cancelled run, so a cancelled run fails rather than passing unchecked.
      - name: Pass only if every part passed
        if: always()
        env:
          DECIDED: ${{ needs.changes.result }}
          CHECKED: ${{ needs.check.result }}
          PACKAGES: ${{ needs.packages.result }}
          COVERAGE: ${{ needs.server-coverage.result }}
          CONTAINERS: ${{ needs.containers.result }}
          DOCUMENTATION_ONLY: ${{ needs.changes.outputs.documentation-only }}
        run: |
          echo "Decided: $DECIDED, checked: $CHECKED, package tests: $PACKAGES, server coverage: $COVERAGE, container tests: $CONTAINERS, documentation only: $DOCUMENTATION_ONLY"
          [ "$DECIDED" = success ] && [ "$CHECKED" = success ] || exit 1
          if [ "$DOCUMENTATION_ONLY" = true ]; then
            [ "$PACKAGES" = skipped ] && [ "$COVERAGE" = skipped ] && [ "$CONTAINERS" = skipped ]
          else
            [ "$PACKAGES" = success ] && [ "$COVERAGE" = success ] && [ "$CONTAINERS" = success ]
          fi
