# SPDX-License-Identifier: Apache-2.0

# Runs the full check, 'pnpm check', on every pull request and every push to the default branch,
# leaving out the package and container tests on a pull request of documentation alone.

name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  # Every push to the default branch is checked; only a pull request's older runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Decide what the change needs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      documentation-only: ${{ steps.decide.outputs.documentation-only }}
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The decision needs Node.js alone, not the dependencies, so it delays the other jobs little.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Decide whether the change is documentation alone
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # Every push to the default branch runs everything, and so does a pull request whose changes
        # can't be told.
        run: |
          only=false
          if [ -n "$BASE" ]; then
            only="$(node scripts/documentation-only.mjs "$BASE")" || only=false
          fi
          echo "documentation-only=$only" >>"$GITHUB_OUTPUT"

  check:
    name: Check without package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # With full history, so the secrets scan sees every commit and the image scans can compare
      # with the default branch.
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and the dependencies
        uses: ./.github/actions/setup

      - name: Run the full check but the package tests
        run: pnpm check --skip "Package tests"

  # On one runner beside the linters and scans, the package tests ran up to thirty times slower than
  # on a developer's computer, until tests timed out, so they have runners of their own.
  packages:
    # A skipped job's name is shown unexpanded, so it names no matrix value; GitHub adds each part's
    # name after it when the job runs, such as Package tests (web).
    name: Package tests
    needs: changes
    if: needs.changes.outputs.documentation-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    # The web app's and the server's tests take longest, so each has a runner's four cores; the rest
    # share one runner, a worker each. A package added later runs with the rest. Each part's settings
    # are looked up by its name, so the matrix holds only the name, which GitHub adds to the job's.
    env:
      PARTS: >-
        {"web": {"packages": "@fathom/web", "workers": 4},
        "server": {"packages": "@fathom/server", "workers": 4},
        "the rest": {"packages": "!@fathom/web !@fathom/server", "workers": 1}}
    strategy:
      fail-fast: false
      matrix:
        part: [web, server, the rest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and the dependencies
        uses: ./.github/actions/setup

      # A selector matching no package fails, so a renamed package is never left untested.
      - name: Run the package tests
        env:
          PACKAGES: ${{ fromJSON(env.PARTS)[matrix.part].packages }}
          VITEST_MAX_WORKERS: ${{ fromJSON(env.PARTS)[matrix.part].workers }}
          PART: ${{ matrix.part }}
        run: |
          if [ -z "$PACKAGES" ]; then
            echo "error: PARTS has no packages for the part '$PART'" >&2
            exit 1
          fi
          read -r -a selectors <<<"$PACKAGES"
          filters=()
          for selector in "${selectors[@]}"; do filters+=(--filter "$selector"); done
          pnpm test:packages "${filters[@]}" --fail-if-no-match

  full:
    name: Full check
    needs: [changes, check, packages]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # The package tests may be left out only for documentation alone; everything else must pass.
      # It runs even in a cancelled run, so a cancelled run fails rather than passing unchecked.
      - name: Pass only if every part passed
        if: always()
        env:
          DECIDED: ${{ needs.changes.result }}
          CHECKED: ${{ needs.check.result }}
          PACKAGES: ${{ needs.packages.result }}
          DOCUMENTATION_ONLY: ${{ needs.changes.outputs.documentation-only }}
        run: |
          echo "Decided: $DECIDED, checked: $CHECKED, package tests: $PACKAGES, documentation only: $DOCUMENTATION_ONLY"
          [ "$DECIDED" = success ] && [ "$CHECKED" = success ] || exit 1
          [ "$PACKAGES" = success ] || { [ "$PACKAGES" = skipped ] && [ "$DOCUMENTATION_ONLY" = true ]; }

  containers:
    name: Container tests
    needs: changes
    # A required check, so it runs and reports whatever the change.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # The job isn't cancelled with its run, so it runs its steps to the end, but a run cancelled
      # before the decision would otherwise skip every step and pass with nothing tested.
      - name: Stop if the decision failed
        if: always()
        env:
          DECIDED: ${{ needs.changes.result }}
        run: '[ "$DECIDED" = success ]'

      - name: Check out
        if: needs.changes.outputs.documentation-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and the dependencies
        if: needs.changes.outputs.documentation-only != 'true'
        uses: ./.github/actions/setup

      - name: Run the container tests
        if: needs.changes.outputs.documentation-only != 'true'
        run: pnpm test:containers
