# SPDX-License-Identifier: Apache-2.0

# Runs the full check, 'pnpm check', on every pull request and every push to the default branch,
# and the container tests on each but a pull request of documentation alone.

name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  # Every push to the default branch is checked; only a pull request's older runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check without package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # With full history, so the secrets scan sees every commit and the image scans can compare
      # with the default branch.
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and the dependencies
        uses: ./.github/actions/setup

      - name: Run the full check but the package tests
        run: pnpm check --skip "Package tests"

  # On one runner beside the linters and scans, the package tests ran up to thirty times slower than
  # on a developer's computer, until tests timed out, so they have runners of their own.
  packages:
    name: Package tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The web app's and the server's tests take longest, so each has a runner's four cores; the
      # rest share one runner, a worker each. A package added later runs with the rest.
      matrix:
        include:
          - name: web
            packages: "@fathom/web"
            workers: 4
          - name: server
            packages: "@fathom/server"
            workers: 4
          - name: the rest
            packages: "!@fathom/web !@fathom/server"
            workers: 1
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and the dependencies
        uses: ./.github/actions/setup

      # A selector matching no package fails, so a renamed package is never left untested.
      - name: Run the package tests
        env:
          PACKAGES: ${{ matrix.packages }}
          VITEST_MAX_WORKERS: ${{ matrix.workers }}
        run: |
          read -r -a selectors <<<"$PACKAGES"
          filters=()
          for selector in "${selectors[@]}"; do filters+=(--filter "$selector"); done
          pnpm test:packages "${filters[@]}" --fail-if-no-match

  full:
    name: Full check
    needs: [check, packages]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Pass only if every part passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Parts: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done

  containers:
    name: Container tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and the dependencies
        uses: ./.github/actions/setup

      - name: Decide whether the change needs the container tests
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # Every push to the default branch runs them, and so does a pull request whose changes can't
        # be told.
        run: |
          run=true
          if [ -n "$BASE" ]; then
            run="$(node scripts/needs-container-tests.mjs "$BASE")" || run=true
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"

      - name: Run the container tests
        if: steps.changed.outputs.run == 'true'
        run: pnpm test:containers
