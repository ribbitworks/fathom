# SPDX-License-Identifier: Apache-2.0

# Runs the full check, 'pnpm check', on every pull request and every push to the default branch, so
# a pull request's green check is the one the maintainer merges on. The container tests run too, on
# the default branch and on a pull request that changes anything but documentation. A newer push to
# a pull request cancels its older runs. The work is in scripts/, which runs the same anywhere; the
# tests make their own throwaway secrets.

name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  # Every push to the default branch is checked; only a pull request's older runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Full check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # With full history, so the secrets scan sees every commit and the image scans can compare
      # with the default branch.
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the full check
        run: pnpm check

  containers:
    name: Container tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Decide whether the change needs the container tests
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # Every push to the default branch runs them, and so does a pull request whose changes can't
        # be told.
        run: |
          run=true
          if [ -n "$BASE" ]; then
            run="$(node scripts/needs-container-tests.mjs "$BASE")" || run=true
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run the container tests
        if: steps.changed.outputs.run == 'true'
        run: pnpm test:containers
