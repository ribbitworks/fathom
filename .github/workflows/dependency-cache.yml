# SPDX-License-Identifier: Apache-2.0

# Fills the default branch's dependency cache, which pull requests and merge queue groups restore
# from, each time the lockfile changes there.

name: Dependency cache

on:
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - .github/actions/setup/**
  workflow_dispatch:

permissions: {}

jobs:
  cache:
    name: Fill the dependency cache
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and the dependencies
        uses: ./.github/actions/setup
