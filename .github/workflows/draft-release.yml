# SPDX-License-Identifier: Apache-2.0

# Drafts a GitHub release for each release tag pushed, such as v0.1.0, once the tag's images build
# and pass the security scan, so no release can be published while a fix in them is overdue. Its
# notes are those GitHub writes from the pull requests merged since the last release, grouped as
# .github/release.yml sets out; a pre-release tag, such as v0.2.0-rc.1, is drafted as a
# pre-release. It never publishes: the maintainer reviews the draft, edits it if they like, and
# publishes it, which runs release.yml to publish the release's images.

name: Draft release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: draft-release-${{ github.ref_name }}

jobs:
  scan:
    name: Build and scan the release's images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # The default branch's scripts and security exceptions judge the release, never the tag's.
      - name: Check out the default branch with every tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Build and scan the images, publishing nothing
        env:
          TAG: ${{ github.ref_name }}
        run: pnpm publish:images --dry-run "$TAG"

  draft:
    name: Draft the release
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Draft the release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --verify-tag --title "$TAG" "${prerelease[@]}"
