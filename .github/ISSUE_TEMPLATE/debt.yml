# The form for a Debt issue: code, tests or documents to put right, with no change people see.

name: Debt
description: Code, tests or documents to put right, with no change people see.
labels: ["debt"]
body:
  - type: textarea
    id: what
    attributes:
      label: What's wanted
      description: What should change, and how it is today.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: The file, with a link to it on GitHub, or the screen.
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: What someone new to Fathom needs to know to fix it, with links to the help page, decisions, conventions and related issues.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How to tell it's finished, such as what a person checks and which tests and commands pass.
  - type: dropdown
    id: when
    attributes:
      label: When
      description: Now for the current work, Next for soon after, Later for when its area is next changed or it is wanted, Maybe for only if a need arises.
      options:
        - Now
        - Next
        - Later
        - Maybe
    validations:
      required: true
  - type: input
    id: found
    attributes:
      label: Found
      description: Who found it and when, such as conventions audit, 2026-11-11.
