# The form for a Bug issue, with its probability and severity, which give its priority.

name: Bug
description: Something that doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Fathom is in early development. The maintainer reads each issue and sets its priority and when it is worked on, as [Issues](https://github.com/ribbitworks/fathom/blob/main/docs/standards/issues.md) describes. Never report a vulnerability here: follow the [Security Policy](https://github.com/ribbitworks/fathom/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What goes wrong.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: The screen, or the file with a link to it on GitHub.
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: What someone new to Fathom needs to know to fix it, with links to the help page, decisions, conventions and related issues.
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Each step to make it happen, numbered.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How to tell it's finished, such as what a person checks and which tests and commands pass.
  - type: dropdown
    id: probability
    attributes:
      label: Probability
      description: How likely it is to happen.
      options:
        - Likely
        - Possible
        - Rare
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How much harm it does when it happens.
      options:
        - Severe
        - Moderate
        - Minor
    validations:
      required: true
  - type: input
    id: found
    attributes:
      label: Found
      description: Who found it and when, such as a GitHub username and a date.
