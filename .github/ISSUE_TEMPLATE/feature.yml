# The form for a Feature issue: something Fathom doesn't do yet, including features on the roadmap.

name: Feature
description: Something Fathom doesn't do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Fathom is in early development. The maintainer reads each issue and sets its priority and when it is worked on, as [Issues](https://github.com/jlarue26/fathom/blob/main/docs/issues.md) describes. Never report a vulnerability here: follow the [Security Policy](https://github.com/jlarue26/fathom/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What's wanted
      description: What Fathom should do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: The screen, or the file with a link to it on GitHub.
    validations:
      required: false
  - type: textarea
    id: background
    attributes:
      label: Background
      description: What someone new to Fathom needs to know to build it, with links to the help page, decisions, conventions and related issues.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How to tell it's finished, such as what a person checks and which tests and commands pass.
  - type: dropdown
    id: when
    attributes:
      label: When
      description: "How soon it is wanted. Now: the current work. Next: soon after. Later: when its area is next changed. Maybe: only if a need arises. The maintainer sets the final timing."
      options:
        - Now
        - Next
        - Later
        - Maybe
    validations:
      required: true
  - type: input
    id: found
    attributes:
      label: Found
      description: Who found it and when, such as a GitHub username and a date.
