packages:
  - apps/*
  - packages/*

engineStrict: true
saveExact: true
strictDepBuilds: true
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
# A backport to the 6.x line, published in July 2023 without the provenance attestation that newer
# 7.x releases already had, so the trust policy reads it as a downgrade. eslint-plugin-react-hooks
# needs it through @babel/core. Only this exact version is excepted, with the owner's approval.
trustPolicyExclude:
  - semver@6.3.1

# Install scripts of dependencies are blocked unless listed here. These are denied because none is
# needed: esbuild's only checks its binary, ssh2 and cpu-features build optional native speed-ups
# for SSH connections to Docker, which are not used, and protobufjs's only prints a notice.
allowBuilds:
  esbuild: false
  ssh2: false
  cpu-features: false
  protobufjs: false

# fastify-type-provider-zod lists these as required, but needs them only to generate OpenAPI
# documents, which Fathom does not do, so they are not installed.
packageExtensions:
  fastify-type-provider-zod:
    peerDependenciesMeta:
      "@fastify/swagger":
        optional: true
      openapi-types:
        optional: true

# Patched versions of indirect dependencies with known vulnerabilities.
overrides:
  js-yaml: 5.5.0
  smol-toml: 1.9.1
  katex: 0.19.1
  "@esbuild-kit/core-utils>esbuild": 0.28.2
  # Testcontainers' archiver and markdownlint-cli have no release that takes these fixes, and
  # ESLint's and typescript-eslint's are too new to install yet.
  "archiver-utils>glob@<14.0.2": 14.0.6
  "minimatch@>=7.0.0 <11.0.1": 11.0.9
  # Drizzle can use Kysely, which Better Auth brings in, but Fathom does not, so Drizzle is installed
  # without it; otherwise the server and the database package would each get a separate copy.
  "drizzle-orm>kysely": "-"
  # Better Auth can work with these when they are present, and pnpm would link the workspace's own
  # copies, bringing development tools such as drizzle-kit and its native esbuild binary into the
  # production image. Fathom's server uses none of them.
  "better-auth>drizzle-kit": "-"
  "better-auth>vitest": "-"
  "better-auth>react": "-"
  "better-auth>react-dom": "-"
