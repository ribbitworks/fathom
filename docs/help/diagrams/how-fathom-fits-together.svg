<!-- How Fathom's records fit together, the overview Help and the domain model show. -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 19 1127 252" width="1127" height="252" role="img" aria-labelledby="how-fathom-fits-together-title" aria-describedby="how-fathom-fits-together-desc" class="help-diagram">
  <title id="how-fathom-fits-together-title">How Fathom's records fit together</title>
  <desc id="how-fathom-fits-together-desc">Plan: a feature is needed by a project, or proposed in a proposal, a project or a proposal is for a customer, and an activity is in a project or a release. Ship: a feature ships in a cycle, and a cycle is in a release. People: a person is on a feature team, a feature team delivers features and does activities, and a person is allocated to features.</desc>
  <style>
    .help-diagram { font-family: "IBM Plex Sans", system-ui, sans-serif; }
    .help-diagram .group { fill: none; stroke: #dee2e6; }
    .help-diagram .group-name { fill: #868e96; font-size: 14px; font-weight: 600; }
    .help-diagram .box { fill: #ffffff; stroke: #ced4da; }
    .help-diagram .name { fill: #212529; font-size: 14px; }
    .help-diagram .line { fill: none; stroke: #868e96; stroke-width: 1.5px; }
    .help-diagram .head { fill: #868e96; }
    .help-diagram .label { fill: #868e96; font-size: 12px; paint-order: stroke; stroke: #ffffff; stroke-width: 8px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .help-diagram .group { stroke: #424242; }
      .help-diagram .box { fill: #161b22; stroke: #424242; }
      .help-diagram .name { fill: #c9c9c9; }
      .help-diagram .label { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="how-fathom-fits-together-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <g>
    <rect class="group" x="10" y="20" width="170" height="250" rx="8"/>
    <text class="group-name" x="26" y="44">People</text>
    <rect class="group" x="245" y="20" width="720" height="250" rx="8"/>
    <text class="group-name" x="261" y="44">Plan</text>
    <rect class="group" x="985" y="20" width="150" height="250" rx="8"/>
    <text class="group-name" x="1001" y="44">Ship</text>
  </g>

  <g>
    <line class="line" x1="95" y1="105" x2="95" y2="185" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="155" y1="80" x2="275" y2="80" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="155" y1="195" x2="275" y2="95" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="155" y1="215" x2="275" y2="215" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="395" y1="70" x2="1010" y2="70" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="395" y1="90" x2="455" y2="135" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="395" y1="205" x2="455" y2="165" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="395" y1="225" x2="1010" y2="225" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="575" y1="150" x2="635" y2="150" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="815" y1="150" x2="755" y2="150" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="395" y1="80" x2="815" y2="135" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="1070" y1="90" x2="1070" y2="205" marker-end="url(#how-fathom-fits-together-arrow)"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <text class="label" x="95" y="145">on</text>
    <text class="label" x="215" y="80">allocated to</text>
    <text class="label" x="215" y="145">delivers</text>
    <text class="label" x="215" y="215">does</text>
    <text class="label" x="700" y="70">ships in</text>
    <text class="label" x="425" y="112">needed by</text>
    <text class="label" x="425" y="185">in</text>
    <text class="label" x="700" y="225">in</text>
    <text class="label" x="605" y="150">for</text>
    <text class="label" x="785" y="150">for</text>
    <text class="label" x="655" y="107">proposed in</text>
    <text class="label" x="1070" y="147">in</text>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <rect class="box" x="35" y="65" width="120" height="40" rx="6"/>
    <text class="name" x="95" y="85">Person</text>
    <rect class="box" x="35" y="185" width="120" height="40" rx="6"/>
    <text class="name" x="95" y="205">Feature team</text>
    <rect class="box" x="275" y="60" width="120" height="40" rx="6"/>
    <text class="name" x="335" y="80">Feature</text>
    <rect class="box" x="275" y="195" width="120" height="40" rx="6"/>
    <text class="name" x="335" y="215">Activity</text>
    <rect class="box" x="455" y="130" width="120" height="40" rx="6"/>
    <text class="name" x="515" y="150">Project</text>
    <rect class="box" x="635" y="130" width="120" height="40" rx="6"/>
    <text class="name" x="695" y="150">Customer</text>
    <rect class="box" x="815" y="130" width="120" height="40" rx="6"/>
    <text class="name" x="875" y="150">Proposal</text>
    <rect class="box" x="1010" y="50" width="120" height="40" rx="6"/>
    <text class="name" x="1070" y="70">Cycle</text>
    <rect class="box" x="1010" y="205" width="120" height="40" rx="6"/>
    <text class="name" x="1070" y="225">Release</text>
  </g>
</svg>
