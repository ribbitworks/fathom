<!-- How Fathom's records fit together, the overview Help and the domain model show. -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 19 1172 252" width="1172" height="252" role="img" aria-labelledby="how-fathom-fits-together-title" aria-describedby="how-fathom-fits-together-desc" class="help-diagram">
  <title id="how-fathom-fits-together-title">How Fathom's records fit together</title>
  <desc id="how-fathom-fits-together-desc">Plan: a feature is needed by a project, or proposed in a proposal, a project or a proposal is for a customer, and an activity is in a project or a release. Ship: a feature ships in a cycle, and a cycle is in a release. People: a person is on a feature team, a feature team delivers features and does activities, and a person is allocated to features.</desc>
  <style>
    .help-diagram { font-family: "IBM Plex Sans", system-ui, sans-serif; }
    .help-diagram .group { fill: none; stroke: #dee2e6; }
    .help-diagram .group-name { fill: #868e96; font-size: 14px; font-weight: 600; }
    .help-diagram .box { fill: #ffffff; stroke: #ced4da; }
    .help-diagram .name { fill: #212529; font-size: 14px; }
    .help-diagram .line { fill: none; stroke: #868e96; stroke-width: 1.5px; }
    .help-diagram .head { fill: #868e96; }
    .help-diagram .label { fill: #868e96; font-size: 12px; paint-order: stroke; stroke: #ffffff; stroke-width: 8px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .help-diagram .group { stroke: #424242; }
      .help-diagram .box { fill: #161b22; stroke: #424242; }
      .help-diagram .name { fill: #c9c9c9; }
      .help-diagram .label { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="how-fathom-fits-together-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <g>
    <rect class="group" x="10" y="20" width="170" height="250" rx="8"/>
    <text class="group-name" x="26" y="44">People</text>
    <rect class="group" x="290" y="20" width="720" height="250" rx="8"/>
    <text class="group-name" x="306" y="44">Plan</text>
    <rect class="group" x="1030" y="20" width="150" height="250" rx="8"/>
    <text class="group-name" x="1046" y="44">Ship</text>
  </g>

  <g>
    <line class="line" x1="95" y1="105" x2="95" y2="185" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="155" y1="80" x2="320" y2="80" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="155" y1="195" x2="320" y2="95" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="155" y1="215" x2="320" y2="215" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="440" y1="70" x2="1055" y2="70" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="440" y1="90" x2="500" y2="135" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="440" y1="205" x2="500" y2="165" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="440" y1="225" x2="1055" y2="225" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="620" y1="150" x2="680" y2="150" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="860" y1="150" x2="800" y2="150" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="440" y1="80" x2="860" y2="135" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="1115" y1="90" x2="1115" y2="205" marker-end="url(#how-fathom-fits-together-arrow)"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <text class="label" x="95" y="145">on</text>
    <text class="label" x="237" y="80">allocated to</text>
    <text class="label" x="237" y="145">delivers</text>
    <text class="label" x="237" y="215">does</text>
    <text class="label" x="745" y="70">ships in</text>
    <text class="label" x="470" y="112">needed by</text>
    <text class="label" x="470" y="185">in</text>
    <text class="label" x="745" y="225">in</text>
    <text class="label" x="650" y="150">for</text>
    <text class="label" x="830" y="150">for</text>
    <text class="label" x="700" y="107">proposed in</text>
    <text class="label" x="1115" y="147">in</text>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <rect class="box" x="35" y="65" width="120" height="40" rx="6"/>
    <text class="name" x="95" y="85">Person</text>
    <rect class="box" x="35" y="185" width="120" height="40" rx="6"/>
    <text class="name" x="95" y="205">Feature team</text>
    <rect class="box" x="320" y="60" width="120" height="40" rx="6"/>
    <text class="name" x="380" y="80">Feature</text>
    <rect class="box" x="320" y="195" width="120" height="40" rx="6"/>
    <text class="name" x="380" y="215">Activity</text>
    <rect class="box" x="500" y="130" width="120" height="40" rx="6"/>
    <text class="name" x="560" y="150">Project</text>
    <rect class="box" x="680" y="130" width="120" height="40" rx="6"/>
    <text class="name" x="740" y="150">Customer</text>
    <rect class="box" x="860" y="130" width="120" height="40" rx="6"/>
    <text class="name" x="920" y="150">Proposal</text>
    <rect class="box" x="1055" y="50" width="120" height="40" rx="6"/>
    <text class="name" x="1115" y="70">Cycle</text>
    <rect class="box" x="1055" y="205" width="120" height="40" rx="6"/>
    <text class="name" x="1115" y="225">Release</text>
  </g>
</svg>
