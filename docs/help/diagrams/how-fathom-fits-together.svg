<!-- How Fathom's records fit together, the overview Help and the domain model show. -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 19 942 342" width="942" height="342" role="img" aria-labelledby="how-fathom-fits-together-title" aria-describedby="how-fathom-fits-together-desc" class="help-diagram">
  <title id="how-fathom-fits-together-title">How Fathom's records fit together</title>
  <desc id="how-fathom-fits-together-desc">Plan: a feature is needed by a project, or proposed in a proposal, and a project or a proposal is for a customer. Ship: a feature ships in a cycle, and a cycle is in a release. People: a person is on a feature team, a feature team delivers features, and a person is allocated to features.</desc>
  <style>
    .help-diagram { font-family: "IBM Plex Sans", system-ui, sans-serif; }
    .help-diagram .group { fill: none; stroke: #dee2e6; }
    .help-diagram .group-name { fill: #868e96; font-size: 14px; font-weight: 600; }
    .help-diagram .box { fill: #ffffff; stroke: #ced4da; }
    .help-diagram .name { fill: #212529; font-size: 14px; }
    .help-diagram .line { fill: none; stroke: #868e96; stroke-width: 1.5px; }
    .help-diagram .head { fill: #868e96; }
    .help-diagram .label { fill: #868e96; font-size: 12px; paint-order: stroke; stroke: #ffffff; stroke-width: 8px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .help-diagram .group { stroke: #424242; }
      .help-diagram .box { fill: #161b22; stroke: #424242; }
      .help-diagram .name { fill: #c9c9c9; }
      .help-diagram .label { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="how-fathom-fits-together-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <g>
    <rect class="group" x="10" y="20" width="170" height="340" rx="8"/>
    <text class="group-name" x="26" y="44">People</text>
    <rect class="group" x="290" y="20" width="660" height="200" rx="8"/>
    <text class="group-name" x="306" y="44">Plan</text>
    <rect class="group" x="290" y="250" width="660" height="110" rx="8"/>
    <text class="group-name" x="306" y="274">Ship</text>
  </g>

  <g>
    <line class="line" x1="95" y1="110" x2="95" y2="230" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="155" y1="90" x2="320" y2="108" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="155" y1="250" x2="320" y2="128" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="440" y1="105" x2="570" y2="70" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="440" y1="125" x2="570" y2="160" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="690" y1="70" x2="810" y2="105" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="690" y1="160" x2="810" y2="125" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="380" y1="135" x2="380" y2="295" marker-end="url(#how-fathom-fits-together-arrow)"/>
    <line class="line" x1="440" y1="315" x2="570" y2="315" marker-end="url(#how-fathom-fits-together-arrow)"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <text class="label" x="95" y="170">on</text>
    <text class="label" x="237" y="99">allocated to</text>
    <text class="label" x="237" y="189">delivers</text>
    <text class="label" x="505" y="87">needed by</text>
    <text class="label" x="505" y="142">proposed in</text>
    <text class="label" x="750" y="87">for</text>
    <text class="label" x="750" y="142">for</text>
    <text class="label" x="380" y="235">ships in</text>
    <text class="label" x="505" y="315">in</text>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <rect class="box" x="35" y="70" width="120" height="40" rx="6"/>
    <text class="name" x="95" y="90">Person</text>
    <rect class="box" x="35" y="230" width="120" height="40" rx="6"/>
    <text class="name" x="95" y="250">Feature team</text>
    <rect class="box" x="320" y="95" width="120" height="40" rx="6"/>
    <text class="name" x="380" y="115">Feature</text>
    <rect class="box" x="570" y="45" width="120" height="40" rx="6"/>
    <text class="name" x="630" y="65">Project</text>
    <rect class="box" x="570" y="145" width="120" height="40" rx="6"/>
    <text class="name" x="630" y="165">Proposal</text>
    <rect class="box" x="810" y="95" width="120" height="40" rx="6"/>
    <text class="name" x="870" y="115">Customer</text>
    <rect class="box" x="320" y="295" width="120" height="40" rx="6"/>
    <text class="name" x="380" y="315">Cycle</text>
    <rect class="box" x="570" y="295" width="120" height="40" rx="6"/>
    <text class="name" x="630" y="315">Release</text>
  </g>
</svg>
